name: Feature request
description: Suggest a server management control or workflow
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What server problem should this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What behavior would help?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Performance, compatibility, or access constraints
