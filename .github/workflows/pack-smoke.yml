name: Cobbleverse runtime smoke

on:
  workflow_dispatch:
    inputs:
      manager_tag:
        description: Published preview tag (used when build_run is empty)
        default: v0.5.0
        type: string
      build_run:
        description: Successful Build run ID on main for testing unpublished changes
        type: string
      accept_minecraft_eula:
        description: Accept the Minecraft EULA for this temporary test server
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    if: inputs.accept_minecraft_eula
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install display and launcher tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          python -m pip install minecraft-launcher-lib==8.0
      - name: Download manager from a release or a verified build
        env:
          GH_TOKEN: ${{ github.token }}
          MANAGER_TAG: ${{ inputs.manager_tag }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          mkdir -p build/pack-smoke/release
          mkdir -p build/pack-smoke/fixtures
          if [[ -n "$BUILD_RUN" ]]; then
            [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
            build_sha=$(gh run view "$BUILD_RUN" --json workflowName,headBranch,event,conclusion,headSha \
              --jq 'select(.workflowName == "Build" and .headBranch == "main" and .event == "push" and .conclusion == "success") | .headSha')
            [[ "$build_sha" =~ ^[0-9a-f]{40}$ ]]
            gh run download "$BUILD_RUN" --dir build/pack-smoke/release --name "cobbleverse-server-admin-$build_sha"
            gh run download "$BUILD_RUN" --dir build/pack-smoke/fixtures --name "cobbleverse-smoke-fixture-$build_sha"
            sha256sum build/pack-smoke/release/*.jar
            exit 0
          fi
          [[ "$MANAGER_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$MANAGER_TAG" --dir build/pack-smoke/release --pattern '*.jar' --pattern SHA256SUMS.txt
          cd build/pack-smoke/release
          sha256sum --check SHA256SUMS.txt
      - name: Start pack and connect a Fabric client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 960x540x24' python -u tools/benchmarks/pack-smoke.py build/pack-smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobbleverse-smoke-logs
          path: build/pack-smoke/*.log
          if-no-files-found: ignore
          retention-days: 5
