name: Cobbleverse runtime smoke

on:
  workflow_dispatch:
    inputs:
      manager_tag:
        description: Published preview tag
        default: v0.4.7
        required: true
        type: string
      accept_minecraft_eula:
        description: Accept the Minecraft EULA for this temporary test server
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    if: inputs.accept_minecraft_eula
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install display and launcher tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          python -m pip install minecraft-launcher-lib==8.0
      - name: Download release and verify SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          MANAGER_TAG: ${{ inputs.manager_tag }}
        run: |
          [[ "$MANAGER_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p build/pack-smoke/release
          gh release download "$MANAGER_TAG" --dir build/pack-smoke/release --pattern '*.jar' --pattern SHA256SUMS.txt
          cd build/pack-smoke/release
          sha256sum --check SHA256SUMS.txt
      - name: Start pack and connect a Fabric client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 960x540x24' python -u tools/benchmarks/pack-smoke.py build/pack-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobbleverse-smoke-logs
          path: build/pack-smoke/*.log
          if-no-files-found: ignore
          retention-days: 5
