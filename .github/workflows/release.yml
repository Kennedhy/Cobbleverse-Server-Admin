name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install web build dependencies
        run: npm ci --prefix web
      - name: Build server mod
        run: ./gradlew --no-daemon --max-workers=1 remapJar
      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p release
          cp "build/libs/cobbleverse-generation-control-${version}.jar" "release/cobbleverse-generation-control-${version}.jar"
          cd release
          sha256sum "cobbleverse-generation-control-${version}.jar" > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/*
          --verify-tag
          --title "Cobbleverse Server Admin ${GITHUB_REF_NAME#v}"
          --generate-notes
          --prerelease
