name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install web build dependencies
        run: npm ci --prefix web
      - name: Test and build server mod
        run: ./gradlew --no-daemon --max-workers=1 test remapJar
      - uses: actions/upload-artifact@v7
        with:
          name: cobbleverse-server-admin-${{ github.sha }}
          path: build/libs/cobbleverse-generation-control-*.jar
          if-no-files-found: error
          retention-days: 14
