name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Install web build dependencies
        run: npm ci --prefix web
      - name: Test and build server mod
        run: ./gradlew --no-daemon --max-workers=1 test remapJar remapVerificationJar
      - name: Verify server-only artifact
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test -n "$version"
          python3 tools/verify_server_jar.py "build/libs/cobbleverse-generation-control-${version}.jar"
      - name: Include server administration tools
        run: cp tools/open-admin-tunnel.ps1 tools/prepare_server_mods.py build/libs/
      - uses: actions/upload-artifact@v7
        with:
          name: cobbleverse-server-admin-${{ github.sha }}
          path: |
            build/libs/cobbleverse-generation-control-*.jar
            build/libs/open-admin-tunnel.ps1
            build/libs/prepare_server_mods.py
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: cobbleverse-smoke-fixture-${{ github.sha }}
          path: build/verification/cobbleverse-generation-control-smoke-fixture-*.jar
          if-no-files-found: error
          retention-days: 14
